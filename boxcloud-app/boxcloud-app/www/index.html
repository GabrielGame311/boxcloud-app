<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BoxCloud</title>
  <link rel="icon" href="img/boxcloud-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="status-bar" aria-label="Status bar">
      <span id="clock">9:41</span>
      <span class="status-indicators" aria-hidden="true">
        <span class="signal">●●●</span>
        <span>5G</span>
        <span class="battery"><span></span></span>
      </span>
    </header>

    <section class="screen welcome-screen" data-screen="welcome" aria-labelledby="welcome-title">
      <div class="welcome-content">
        <img class="brand-mark" src="img/boxcloud-mark.svg" alt="">
        <h1 id="welcome-title">BoxCloud</h1>
        <p class="tagline">IRL Streaming Platform</p>
        <div class="welcome-actions">
          <button class="button button-primary" type="button" data-open-screen="login">Log In</button>
          <button class="button button-secondary" type="button" data-open-screen="register">Register</button>
        </div>
      </div>
    </section>

    <section class="screen form-screen" data-screen="login" aria-labelledby="login-title" hidden>
      <button class="back-button" type="button" data-open-screen="welcome" aria-label="Back to welcome screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="form-heading">
        <img class="brand-mark brand-mark-small" src="img/boxcloud-mark.svg" alt="">
        <h1 id="login-title">Log in to BoxCloud</h1>
      </div>
      <form class="account-form" data-account-form="login" novalidate>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" placeholder="name@domain.com" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>
        <label class="remember-option">
          <input name="remember" type="checkbox" checked>
          <span>Remember me for 30 days</span>
        </label>
        <button class="button button-primary" type="submit">Log In</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <button class="text-button" type="button" data-open-screen="register">Create an account</button>
    </section>

    <section class="screen form-screen" data-screen="register" aria-labelledby="register-title" hidden>
      <button class="back-button" type="button" data-open-screen="welcome" aria-label="Back to welcome screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="form-heading">
        <img class="brand-mark brand-mark-small" src="img/boxcloud-mark.svg" alt="">
        <h1 id="register-title">Create your account</h1>
      </div>
      <form class="account-form" data-account-form="register" novalidate>
        <label class="field">
          <span>Name</span>
          <input name="name" type="text" placeholder="Your name" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" placeholder="name@domain.com" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="button button-primary" type="submit">Register</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <button class="text-button" type="button" data-open-screen="login">Already have an account? Log In</button>
    </section>

    <footer class="home-indicator" aria-hidden="true"><span></span></footer>
  </main>
</body>
</html>

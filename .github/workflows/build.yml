name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize Project & Setup Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 -name "*.html" -exec cp {} www/index.html \;
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init BoxCloud com.boxcloudirl.dashboard --web-dir www
          npx cap add ios
          npx cap copy

      - name: Build Xcode Project Directly
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r BoxCloud.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxCloud-Unsigned-IPA
          path: BoxCloud.ipa

name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Cordova & Build App
        run: |
          npm install -g cordova
          cordova create cordova-app com.boxcloudirl.dashboard BoxCloud
          cp -r www/* cordova-app/www/
          cd cordova-app
          cordova platform add ios
          cordova build ios --release --device -- --codeSignIdentity="" --codeSignRequirement="" --developmentTeam=""

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r cordova-app/platforms/ios/build/device/BoxCloud.app Payload/
          zip -r BoxCloud.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxCloud-Unsigned-IPA
          path: BoxCloud.ipa

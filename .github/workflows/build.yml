name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          # Skapa www-mappen
          mkdir -p www
          
          # Kopiera din riktiga app-fil till www/index.html
          cp boxcloud_irl_ios_dashboard.html www/index.html
          
          # Installera Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # Initialisera och synka med iOS
          npx cap init BoxCloud com.boxcloudirl.dashboard --web-dir www
          npx cap add ios
          npx cap copy
          
          # Skapa strukturen som Xcode förväntar sig
          mkdir -p ios/App/App/public
          cp -r www/* ios/App/App/public/
          touch ios/App/App/config.xml

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r BoxCloud.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxCloud-Unsigned-IPA
          path: BoxCloud.ipa

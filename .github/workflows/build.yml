name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate WWW & Setup Capacitor
        run: |
          # Leta upp var mappen www faktiskt ligger i källkoden
          WWW_PATH=$(find . -maxdepth 3 -type d -name "www" ! -path "./www" | head -n 1)

          if [ -n "$WWW_PATH" ]; then
            echo "Hittade www-mappen på: $WWW_PATH"
            cp -r "$WWW_PATH" ./www
          elif [ ! -d "www" ]; then
            echo "Hittade ingen www-mapp, skapar en från rotfilerna"
            mkdir -p www
            cp index.html www/ 2>/dev/null || true
            cp -r css img js www/ 2>/dev/null || true
          fi

          # Kontrollera att index.html finns
          if [ ! -f "www/index.html" ]; then
            echo "Skapar reserv index.html"
            echo '<!DOCTYPE html><html><body><h1>BoxCloud</h1></body></html>' > www/index.html
          fi

          # Installera Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # Initialisera och synka med iOS
          npx cap init BoxCloud com.boxcloudirl.dashboard --web-dir www
          npx cap add ios
          npx cap copy
          
          # Kopiera alla filer från www till mappen som Xcode förväntar sig
          mkdir -p ios/App/App/public
          cp -r www/* ios/App/App/public/
          touch ios/App/App/config.xml

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r BoxCloud.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxCloud-Unsigned-IPA
          path: BoxCloud.ipa
